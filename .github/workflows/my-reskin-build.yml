name: Build my reskin image

# 自定义构建：用 GitHub 免费算力构建镜像，推送到你自己的 GHCR。
# 触发方式：推送到 reskin 分支，或在 Actions 页手动运行（Run workflow）。

on:
  workflow_dispatch:
  push:
    branches: [reskin]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Compute image name (lowercase owner)
        id: img
        run: |
          owner=$(printf '%s' "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          echo "name=ghcr.io/${owner}/new-api" >> "$GITHUB_OUTPUT"

      - name: Write VERSION
        run: echo "reskin-$(date +'%Y%m%d')-$(git rev-parse --short HEAD)" > VERSION

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build & push (linux/amd64)
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ steps.img.outputs.name }}:reskin
          cache-from: type=gha
          cache-to: type=gha,mode=max
